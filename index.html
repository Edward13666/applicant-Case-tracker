<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Applicant Status Tracker</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    margin:0;
    padding:30px;
}

.container{
    max-width:950px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 0 15px rgba(0,0,0,.1);
}

h1{
    color:#003366;
    margin-bottom:10px;
}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    font-size:16px;
    box-sizing:border-box;
}

button{
    background:#0066cc;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:5px;
    cursor:pointer;
    margin-top:10px;
}

button:hover{
    background:#0052a3;
}

.card{
    margin-top:25px;
    padding:25px;
    background:#f8f9fa;
    border-left:6px solid #0066cc;
    border-radius:8px;
}

.badge{
    display:inline-block;
    background:#28a745;
    color:white;
    padding:8px 15px;
    border-radius:20px;
    font-weight:bold;
    margin-bottom:15px;
}

.photo{
    width:180px;
    height:220px;
    object-fit:cover;
    border-radius:10px;
    border:3px solid #0066cc;
    display:block;
    margin-bottom:15px;
}

.progress-container{
    background:#ddd;
    border-radius:20px;
    overflow:hidden;
    margin:15px 0;
}

.progress-bar{
    width:68%;
    background:#28a745;
    color:white;
    text-align:center;
    padding:8px;
    font-weight:bold;
}

.timeline{
    margin-top:20px;
    padding:15px;
    background:white;
    border-radius:8px;
}

.timeline p{
    margin:8px 0;
}

.note{
    background:#eef6ff;
    padding:15px;
    border-radius:8px;
    margin-top:15px;
}

.not-found{
    color:red;
    font-weight:bold;
    margin-top:20px;
}
</style>

</head>

<body>

<div class="container">

<h1>Applicant Status Tracker</h1>

<p>Enter your case number below to view your application status.</p>

<input type="text" id="caseId" placeholder="Enter Case ID">

<button onclick="searchCase()">
Check Status
</button>

<div id="result"></div>

</div>

<p><strong>Date of Birth:</strong> June 26, 2000</p>

`;

}else{

}

}

</script>

</body>
</html>
